<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning 統合版 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5fa;color:#1d3049}.wrap{max-width:760px;margin:auto}.top{padding:14px 12px 10px;background:#fff;border-bottom:1px solid #dbe4ef}.top h1{font-size:19px;margin:0 0 9px}.versions{font-size:12px;color:#53677d;display:flex;flex-wrap:wrap;gap:6px}.versions span{background:#eef3fa;border-radius:7px;padding:5px 7px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:9px 10px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #dbe4ef}nav button{border:1px solid #d6dfeb;background:#f6f8fc;border-radius:10px;padding:12px 3px;font-size:14px;font-weight:700;color:#263e58}nav button.active{background:#1765d1;color:#fff;border-color:#1765d1}iframe{display:none;border:0;width:100%;height:calc(100dvh - 154px);min-height:560px;background:#f1f5fa}iframe.active{display:block}.note{font-size:12px;padding:7px 12px;color:#52657c;background:#fff}@media(max-width:380px){nav button{font-size:12px}.versions{font-size:11px}}</style></head><body><div class="wrap"><header class="top"><h1>My Learning <small style="font-size:12px">統合版 2</small></h1><div class="versions"><span>単語：GD7</span><span>学習：ST56</span><span>問題：QM56</span></div></header><nav role="tablist" aria-label="学習モード"><button id="tab-word" class="active" role="tab" aria-selected="true" onclick="switchTab('word')">単語モード</button><button id="tab-study" role="tab" aria-selected="false" onclick="switchTab('study')">学習モード</button><button id="tab-quiz" role="tab" aria-selected="false" onclick="switchTab('quiz')">問題モード</button></nav><iframe id="frame-word" title="単語モード GD7" class="active" src="drive.html?v=GD7" loading="eager"></iframe><iframe id="frame-study" title="学習モード ST56" data-src="study.html?v=ST56" loading="lazy"></iframe><iframe id="frame-quiz" title="問題モード QM56" data-src="quiz.html?v=QM56" loading="lazy"></iframe><div class="note">各モードの学習記録は独立しています。学習・問題モードはST56方式の設定保存領域を共用します。単語モードのGD7設定は現時点では独立しています。</div></div><script>function switchTab(mode){for(const id of ['word','study','quiz']){let on=id===mode;document.getElementById('tab-'+id).classList.toggle('active',on);document.getElementById('tab-'+id).setAttribute('aria-selected',String(on));let frame=document.getElementById('frame-'+id);frame.classList.toggle('active',on);if(on&&!frame.getAttribute('src'))frame.src=frame.dataset.src;}try{localStorage.setItem('my-learning-combined-tab',mode)}catch(e){}}let saved='word';try{saved=localStorage.getItem('my-learning-combined-tab')||'word'}catch(e){}if(['word','study','quiz'].includes(saved))switchTab(saved);</script></body></html>
