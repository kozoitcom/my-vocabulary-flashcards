<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Learning 統合版 14</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f1f5fa;color:#1d3049}.wrap{max-width:760px;margin:auto}.top{padding:14px 12px 10px;background:#fff;border-bottom:1px solid #dbe4ef}.top h1{font-size:19px;margin:0 0 9px}.versions{font-size:12px;color:#53677d;display:flex;flex-wrap:wrap;gap:6px}.versions span{background:#eef3fa;border-radius:7px;padding:5px 7px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:9px 10px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #dbe4ef}nav button{border:1px solid #d6dfeb;background:#f6f8fc;border-radius:10px;padding:12px 3px;font-size:14px;font-weight:700;color:#263e58}nav button.active{background:#1765d1;color:#fff;border-color:#1765d1}iframe{display:none;border:0;width:100%;height:calc(100dvh - 154px);min-height:560px;background:#f1f5fa}iframe.active{display:block}.note{font-size:12px;padding:7px 12px;color:#52657c;background:#fff}@media(max-width:380px){nav button{font-size:12px}.versions{font-size:11px}}.wakeControls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;font-size:13px}.wakeControls label{display:flex;align-items:center;gap:7px;font-weight:600}.wakeControls input{width:19px;height:19px;accent-color:#1765d1} .wakeStatus{font-size:12px;color:#52657c}.titleRow{display:flex;align-items:center;justify-content:space-between;gap:8px}.installButton{border:1px solid #cbd8e8;background:#f5f9ff;color:#1765d1;border-radius:8px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}.installButton svg{width:17px;height:17px}.installHint{display:none;font-size:12px;line-height:1.6;margin:6px 0;padding:8px;border:1px solid #d6dfeb;border-radius:8px;background:#f8fbff}.installHint.show{display:block}</style></head><body><div class="wrap"><header class="top"><div class="titleRow"><h1>My Learning <small style="font-size:12px">統合版 14</small></h1><button id="installApp" class="installButton" title="ホーム画面に追加" aria-label="ホーム画面に追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></svg></button></div><div id="installHint" class="installHint" role="status" aria-live="polite"></div><div class="versions"><span>単語：GD10</span><span>学習：SD63</span><span>問題：QD63</span></div><div class="wakeControls"><label for="keepAwake"><input id="keepAwake" type="checkbox" checked>画面スリープ防止</label><span class="wakeStatus" id="wakeStatus" role="status" aria-live="polite">確認中…</span></div></header><nav role="tablist" aria-label="学習モード"><button id="tab-word" class="active" role="tab" aria-selected="true" onclick="switchTab('word')">単語モード</button><button id="tab-study" role="tab" aria-selected="false" onclick="switchTab('study')">学習モード</button><button id="tab-quiz" role="tab" aria-selected="false" onclick="switchTab('quiz')">問題モード</button></nav><iframe id="frame-word" title="単語モード GD10" class="active" src="drive.html?v=GD10-autosync13" loading="eager"></iframe><iframe id="frame-study" title="学習モード SD63" data-src="study.html?v=SD63" loading="lazy"></iframe><iframe id="frame-quiz" title="問題モード QD63" data-src="quiz.html?v=QD63" loading="lazy"></iframe><div class="note">各モードの学習記録は独立しています。学習・問題モードはSD63方式の設定保存領域を共用します。単語モードのGD10設定は現時点では独立しています。</div></div><script>
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
window.addEventListener('appinstalled',()=>{installPrompt=null;const hint=document.getElementById('installHint');hint.textContent='ホーム画面への追加が完了しました。';hint.classList.add('show')});
document.getElementById('installApp').addEventListener('click',async()=>{
 const hint=document.getElementById('installHint');
 if(installPrompt){const prompt=installPrompt;installPrompt=null;await prompt.prompt();return}
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
 hint.textContent=ios?'Safariの共有ボタンから「ホーム画面に追加」を選んでください。':'Chromeの右上「︙」メニューから「ホーム画面に追加」または「アプリをインストール」を選んでください。';
 hint.classList.toggle('show',true);
});
const wakeKey='my-learning-keep-awake-v1';
let wakeLock=null,wakeWanted=true,wakeRequesting=false;
try{wakeWanted=localStorage.getItem(wakeKey)!=='off'}catch(e){}
const wakeToggle=document.getElementById('keepAwake');
const wakeStatus=document.getElementById('wakeStatus');
wakeToggle.checked=wakeWanted;
function wakeMessage(message){wakeStatus.textContent=message}
async function releaseWake(){const lock=wakeLock;wakeLock=null;if(lock){try{await lock.release()}catch(e){}}}
async function updateWake(){
 if(!wakeWanted){await releaseWake();wakeMessage('オフ');return}
 if(document.visibilityState!=='visible'){await releaseWake();wakeMessage('画面を戻すと再開');return}
 if(!('wakeLock' in navigator)){wakeMessage('このブラウザでは非対応');return}
 if(wakeLock){wakeMessage('オン・画面を維持中');return}
 if(wakeRequesting)return;
 wakeRequesting=true;
 try{const lock=await navigator.wakeLock.request('screen');if(!wakeWanted||document.visibilityState!=='visible'){await lock.release();return}wakeLock=lock;wakeMessage('オン・画面を維持中');lock.addEventListener('release',()=>{if(wakeLock===lock)wakeLock=null;if(wakeWanted){wakeMessage('一時解除・復帰時に再開')}})}
 catch(e){wakeMessage('制限中：ブラウザまたは省電力設定を確認')}
 finally{wakeRequesting=false}
}
wakeToggle.addEventListener('change',()=>{wakeWanted=wakeToggle.checked;try{localStorage.setItem(wakeKey,wakeWanted?'on':'off')}catch(e){}void updateWake()});
document.addEventListener('visibilitychange',()=>{void updateWake()});
window.addEventListener('focus',()=>{void updateWake()});
window.addEventListener('pagehide',()=>{void releaseWake()});
void updateWake();
function switchTab(mode){for(const id of ['word','study','quiz']){let on=id===mode;document.getElementById('tab-'+id).classList.toggle('active',on);document.getElementById('tab-'+id).setAttribute('aria-selected',String(on));let frame=document.getElementById('frame-'+id);frame.classList.toggle('active',on);if(on&&!frame.getAttribute('src'))frame.src=frame.dataset.src;}try{localStorage.setItem('my-learning-combined-tab',mode)}catch(e){}}let saved='word';try{saved=localStorage.getItem('my-learning-combined-tab')||'word'}catch(e){}if(['word','study','quiz'].includes(saved))switchTab(saved);</script></body></html>
