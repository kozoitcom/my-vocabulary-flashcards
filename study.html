<!doctype html><html lang="ja"><meta charset="utf-8"><title>My Learning ST1</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#f1f5fa;color:#1d3049;max-width:680px;margin:auto;padding:18px}section{background:white;padding:18px;border-radius:16px;margin:14px 0}button,input{padding:12px;border-radius:9px;border:1px solid #ccd5e0;font:inherit}input{width:95%}button{cursor:pointer}button:disabled{opacity:.5}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#fff}.chosen{background:#dceaff}.primary{background:#1765d1;color:white}.hidden{display:none}.good{color:green}.bad{color:#c62828}#question{font-size:22px;font-weight:700;white-space:pre-wrap}#explain{white-space:pre-wrap}</style><h2>My Learning｜問題演習 <small>Ver.ST1</small></h2><section><p>Googleスプレッドシート公開CSV URL</p><input id="url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"><p><input id="name" placeholder="教科・問題集名"></p><button id="load" class="primary">読み込み</button> <button id="sample">サンプル</button><p id="message"></p></section><section><h3 id="title">問題集を読み込んでください</h3><p id="counter">0 / 0</p><div id="front"><p id="question"></p><div id="choices"></div><button id="check" class="primary" disabled>答え合わせ</button></div><div id="back" class="hidden"><h2 id="result"></h2><p id="selected"></p><p id="correct"></p><h3>解説</h3><p id="explain"></p><button id="explainVoice">🔊 解説</button> <button id="nextBack">次の問題 →</button></div><p><button id="prev">← 前へ</button> <button id="next">次へ →</button></p><button id="speak">🔊 問題を読む</button> <button id="stop">■ 停止</button><p id="score"></p></section><section><label>読み上げ速度 <select id="rate"><option value=".7">0.7</option><option value=".9" selected>0.9</option><option value="1.2">1.2</option></select></label></section><script>
'use strict';const $=x=>document.getElementById(x);let qs=[],i=0,choice=null,attempts=0,hits=0;function csv(t){let a=[],r=[],v='',q=false;for(let j=0;j<t.length;j++){let c=t[j];if(q){if(c==='"'&&t[j+1]==='"'){v+='"';j++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[j+1]==='\n')j++;r.push(v);a.push(r);r=[];v=''}else v+=c}if(q)throw Error('CSV引用符エラー');if(r.length||v){r.push(v);a.push(r)}return a}function parse(rows){let out=[],errors=[];rows.forEach((r,n)=>{if(!r.some(x=>x.trim()))return;if(n===0&&/^(question|問題)/i.test(r[0].trim()))return;try{if(r.length<4||!r[0].trim()||!r[3].trim())throw Error('必須列不足');let s=r[1],re=/(^|[\s\/;|])([ABCD])[.．、:)）]\s*/g,m,marks=[];while((m=re.exec(s)))marks.push({id:m[2],start:m.index+m[1].length,end:re.lastIndex});if(marks.map(x=>x.id).join('')!=='ABCD')throw Error('選択肢形式不正');let opts=marks.map((x,k)=>({id:x.id,text:s.slice(x.end,k<3?marks[k+1].start:s.length).replace(/[\s\/;|]+$/,'').trim()}));if(opts.some(x=>!x.text))throw Error('空の選択肢');let answer=r[2].trim().match(/^([ABCD])(?:\s*[.．、:)）]\s*(.*))?$/i);if(!answer)throw Error('正解形式不正');let id=answer[1].toUpperCase();if(answer[2]&&answer[2].trim()!==opts.find(x=>x.id===id).text)throw Error('正解文不一致');out.push({question:r[0],opts,id,explanation:r[3]})}catch(e){errors.push((n+1)+'行目: '+e.message)}});return {out,errors}}function stop(){speechSynthesis.cancel()}function say(t){stop();let u=new SpeechSynthesisUtterance(t);u.lang=/[ぁ-んァ-ン一-龯]/.test(t)?'ja-JP':'en-US';u.rate=+$('rate').value;speechSynthesis.speak(u)}function show(){stop();let q=qs[i];$('title').textContent=$('name').value||'問題演習';$('counter').textContent=q?(i+1)+' / '+qs.length:'0 / 0';$('front').classList.remove('hidden');$('back').classList.add('hidden');$('question').textContent=q?.question||'';$('choices').replaceChildren();choice=null;if(q)q.opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o.id+'. '+o.text;b.onclick=()=>{choice=o.id;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');$('check').disabled=false};$('choices').append(b)});$('check').disabled=true;$('prev').disabled=i===0;$('next').disabled=!q||i===qs.length-1;$('nextBack').disabled=!q||i===qs.length-1;$('score').textContent='今回の正解率：'+hits+' / '+attempts+(attempts?' ('+Math.round(100*hits/attempts)+'%)':'')}function load(rows){let {out,errors}=parse(rows);if(!out.length)throw Error('有効な問題なし: '+errors.join('; '));qs=out;i=attempts=hits=0;show();$('message').textContent=out.length+'問読み込み。'+(errors.length?' 除外: '+errors.join('; '):'')}function move(d){if(i+d>=0&&i+d<qs.length){i+=d;show()}}$('load').onclick=async()=>{try{let u=$('url').value;if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u))throw Error('Google Sheetsの公開CSV URLが必要です');let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);load(csv(await r.text()))}catch(e){$('message').textContent=e.message}};$('sample').onclick=()=>{$('name').value='サンプル';load([['Question','Choices','Correct Answer','Explanation'],['120円のノートを3冊買いました。合計はいくらですか？','A. 240円 / B. 300円 / C. 360円 / D. 420円','C. 360円','120 × 3 = 360。したがって360円です。'],['What happens to equilibrium price when demand increases and supply remains constant?','A. Decreases / B. Increases / C. Remains unchanged / D. Becomes zero','B. Increases','Demand increases, so equilibrium price increases.']])};$('check').onclick=()=>{if(!choice)return;let q=qs[i],ok=choice===q.id;attempts++;if(ok)hits++;$('result').textContent=ok?'✓ 正解！':'✕ 不正解！';$('result').className=ok?'good':'bad';$('selected').textContent='あなたの回答：'+choice+'. '+q.opts.find(x=>x.id===choice).text;$('correct').textContent='正しい回答：'+q.id+'. '+q.opts.find(x=>x.id===q.id).text;$('explain').textContent=q.explanation;$('front').classList.add('hidden');$('back').classList.remove('hidden');$('score').textContent='今回の正解率：'+hits+' / '+attempts+' ('+Math.round(100*hits/attempts)+'%)'};$('prev').onclick=()=>move(-1);$('next').onclick=$('nextBack').onclick=()=>move(1);$('speak').onclick=()=>{if(qs[i])say(qs[i].question)};$('explainVoice').onclick=()=>{if(qs[i])say(qs[i].explanation)};$('stop').onclick=stop;addEventListener('pagehide',stop);show();</script></html>
