<!doctype html><html lang="ja"><meta charset="utf-8"><title>My Learning ST4 Cloud</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;background:#f1f5fa;color:#1d3049;max-width:680px;margin:auto;padding:18px}section{background:white;padding:18px;border-radius:16px;margin:14px 0}button,input{padding:12px;border-radius:9px;border:1px solid #ccd5e0;font:inherit}input{width:95%}button{cursor:pointer}button:disabled{opacity:.5}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#fff}.chosen{background:#dceaff}.primary{background:#1765d1;color:white}.hidden{display:none}.good{color:green}.bad{color:#c62828}#question{font-size:22px;font-weight:700;white-space:pre-wrap}#explain{white-space:pre-wrap}</style><h2>My Learning｜問題演習 <small>Ver.ST4</small></h2><section><p>Googleスプレッドシート公開CSV URL</p><input id="url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"><p><input id="name" placeholder="教科・問題集名"></p><details><summary>⚙ シート別の列割り当て</summary><p>表面・裏面に表示する列（例：A または B,C）。設定はシートごとに保存されます。</p><label>表面 <input id="frontCols" value="A" placeholder="A,B"></label><label>裏面 <input id="backCols" value="B" placeholder="B,C"></label><button id="saveMapping" type="button">このシートの設定を保存</button><p id="mappingStatus"></p></details><button id="load" class="primary">A列を読み込み（学習モード）</button> <button id="sample">サンプル</button><p id="message"></p></section><section><h3>☁ Google Drive 学習履歴</h3><button id="connect" class="primary">Googleアカウントで接続・復元</button> <button id="saveCloud" disabled>今すぐ同期</button><p id="cloudStatus" aria-live="polite">未接続。学習記録はこの端末に保持されます。</p></section><section><h3 id="title">問題集を読み込んでください</h3><p id="counter">0 / 0</p><div id="front"><p id="question"></p><button id="flip" type="button">裏面を見る</button><p id="studyHint" class="hidden">学習モード：A列の内容を表示しています。回答・採点は行いません。</p><div id="choices"></div><button id="check" class="primary" disabled>答え合わせ</button></div><div id="back" class="hidden"><p id="backText" style="white-space:pre-wrap"></p><button id="flipFront" type="button">表面に戻る</button><h2 id="result"></h2><p id="selected"></p><p id="correct"></p><h3>解説</h3><p id="explain"></p><button id="explainVoice">🔊 解説</button> <button id="nextBack">次の問題 →</button></div><p><button id="prev">← 前へ</button> <button id="next">次へ →</button></p><button id="speak">🔊 問題を読む</button> <button id="stop">■ 停止</button><p id="score"></p></section><section><label>読み上げ速度 <select id="rate"><option value=".7">0.7</option><option value=".9" selected>0.9</option><option value="1.2">1.2</option></select></label></section><script src="https://accounts.google.com/gsi/client" async defer></script><script>
'use strict';const $=x=>document.getElementById(x);let qs=[],i=0,choice=null,attempts=0,hits=0;function csv(t){let a=[],r=[],v='',q=false;for(let j=0;j<t.length;j++){let c=t[j];if(q){if(c==='"'&&t[j+1]==='"'){v+='"';j++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[j+1]==='\n')j++;r.push(v);a.push(r);r=[];v=''}else v+=c}if(q)throw Error('CSV引用符エラー');if(r.length||v){r.push(v);a.push(r)}return a}function parse(rows){let out=[],errors=[];rows.forEach((r,n)=>{if(!r.some(x=>x.trim()))return;if(n===0&&/^(question|問題)/i.test(r[0].trim()))return;try{if(r.length<4||!r[0].trim()||!r[3].trim())throw Error('必須列不足');let s=r[1],re=/(^|[\s\/;|])([ABCD])[.．、:)）]\s*/g,m,marks=[];while((m=re.exec(s)))marks.push({id:m[2],start:m.index+m[1].length,end:re.lastIndex});if(marks.map(x=>x.id).join('')!=='ABCD')throw Error('選択肢形式不正');let opts=marks.map((x,k)=>({id:x.id,text:s.slice(x.end,k<3?marks[k+1].start:s.length).replace(/[\s\/;|]+$/,'').trim()}));if(opts.some(x=>!x.text))throw Error('空の選択肢');let answer=r[2].trim().match(/^([ABCD])(?:\s*[.．、:)）]\s*(.*))?$/i);if(!answer)throw Error('正解形式不正');let id=answer[1].toUpperCase();if(answer[2]&&answer[2].trim()!==opts.find(x=>x.id===id).text)throw Error('正解文不一致');out.push({question:r[0],opts,id,explanation:r[3]})}catch(e){errors.push((n+1)+'行目: '+e.message)}});return {out,errors}}function stop(){speechSynthesis.cancel()}function say(t){stop();let u=new SpeechSynthesisUtterance(t);u.lang=/[ぁ-んァ-ン一-龯]/.test(t)?'ja-JP':'en-US';u.rate=+$('rate').value;speechSynthesis.speak(u)}function show(){stop();let q=qs[i];$('title').textContent=$('name').value||'問題演習';$('counter').textContent=q?(i+1)+' / '+qs.length:'0 / 0';$('front').classList.remove('hidden');$('back').classList.add('hidden');$('question').textContent=q?colText(q.row,mapping().front):'';$('backText').textContent=q?colText(q.row,mapping().back):'';$('choices').replaceChildren();choice=null;$('studyHint').classList.toggle('hidden',!q);$('flip').disabled=!q;$('check').classList.add('hidden');$('nextBack').classList.add('hidden');if(q)q.opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o.id+'. '+o.text;b.onclick=()=>{choice=o.id;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');$('check').disabled=false};$('choices').append(b)});$('check').disabled=true;$('prev').disabled=i===0;$('next').disabled=!q||i===qs.length-1;$('nextBack').disabled=!q||i===qs.length-1;$('score').textContent='今回の正解率：'+hits+' / '+attempts+(attempts?' ('+Math.round(100*hits/attempts)+'%)':'')}let sourceRows=[];function load(rows){sourceRows=rows;let studyRows=rows.filter((r,n)=>r[0]&&r[0].trim()&&!(n===0&&/^(question|問題|学習内容|content)$/i.test(r[0].trim())));let out=studyRows.map(r=>({question:r[0].trim(),row:r,opts:[],id:'',explanation:''})),errors=[];if(!out.length)throw Error('有効な問題なし: '+errors.join('; '));qs=out;i=attempts=hits=0;restoreMapping();if(position.key===bookKey())i=Math.min(Math.max(0,position.index),qs.length-1);show();$('message').textContent=out.length+'件の学習内容をA列から読み込みました。'+(errors.length?' 除外: '+errors.join('; '):'')}function move(d){if(i+d>=0&&i+d<qs.length){i+=d;progress();show()}}$('load').onclick=async()=>{try{let u=$('url').value;if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(u))throw Error('Google Sheetsの公開CSV URLが必要です');let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);load(csv(await r.text()))}catch(e){$('message').textContent=e.message}};$('sample').onclick=()=>{$('name').value='サンプル';load([['Question'],['Scarcity means resources are limited relative to wants.'],['Opportunity cost is the value of the next best alternative.'],['需要が増加し供給が一定なら、均衡価格は上昇します。']])};$('check').onclick=()=>{if(!choice)return;let q=qs[i],ok=choice===q.id;attempts++;if(ok)hits++;record(choice,ok);$('result').textContent=ok?'✓ 正解！':'✕ 不正解！';$('result').className=ok?'good':'bad';$('selected').textContent='あなたの回答：'+choice+'. '+q.opts.find(x=>x.id===choice).text;$('correct').textContent='正しい回答：'+q.id+'. '+q.opts.find(x=>x.id===q.id).text;$('explain').textContent=q.explanation;$('front').classList.add('hidden');$('back').classList.remove('hidden');$('score').textContent='今回の正解率：'+hits+' / '+attempts+' ('+Math.round(100*hits/attempts)+'%)'};$('prev').onclick=()=>move(-1);$('next').onclick=$('nextBack').onclick=()=>move(1);$('speak').onclick=()=>{if(qs[i])say(qs[i].question)};$('explainVoice').onclick=()=>{if(qs[i])say(qs[i].explanation)};$('stop').onclick=stop;addEventListener('pagehide',stop);
const STORE='my-learning-study-st2-v1',CLIENT='617038667107-c5nmardetvdttjjbdir92lg3puuqk1g4.apps.googleusercontent.com';
let token=null,cloudId=null,cloudVersion=null,saving=false,events=[],position={key:'',index:0,at:0},mappings={};
try{let x=JSON.parse(localStorage.getItem(STORE)||'{}');events=Array.isArray(x.events)?x.events:[];position=x.position||position;mappings=x.mappings||{} }catch{}
function persist(){localStorage.setItem(STORE,JSON.stringify({events,position,mappings}))}
function bookKey(){let u=$('url').value.trim();let m=u.match(/spreadsheets\\/d\\/([\w-]+)/);if(m){let g=u.match(/[?&#]gid=(\\d+)/)||u.match(/[?&]single=true[^#]*[&]gid=(\\d+)/);return 'sheet:'+m[1]+':'+(g?g[1]:'0')}return 'sample:'+($('name').value||'サンプル')}
function mapping(){return mappings[bookKey()]||{front:['A'],back:['B'],at:0}}function parseCols(s){let a=s.toUpperCase().split(/[\\s,、，]+/).filter(Boolean);if(!a.length||a.some(x=>! /^[A-Z]{1,2}$/.test(x)))throw Error('列は A,B の形式で指定してください');return [...new Set(a)]}function colText(row,cols){return cols.map(c=>{let n=0;for(let ch of c)n=n*26+ch.charCodeAt(0)-64;return row[n-1]||''}).filter(Boolean).join('\\n\\n')}function restoreMapping(){let m=mapping();$('frontCols').value=m.front.join(',');$('backCols').value=m.back.join(',');$('mappingStatus').textContent='このシートの保存設定を表示中'}$('saveMapping').onclick=()=>{try{let front=parseCols($('frontCols').value),back=parseCols($('backCols').value);mappings[bookKey()]={front,back,at:Date.now()};persist();show();scheduleSave();$('mappingStatus').textContent='設定を保存しました'}catch(e){$('mappingStatus').textContent=e.message}};$('flip').onclick=()=>{$('front').classList.add('hidden');$('back').classList.remove('hidden')};$('flipFront').onclick=()=>{$('front').classList.remove('hidden');$('back').classList.add('hidden')};$('url').addEventListener('change',restoreMapping);function record(answer,correct){let q=qs[i];events.push({id:crypto.randomUUID(),book:bookKey(),question:q.question,answer,correct,at:Date.now()});position={key:bookKey(),index:i,at:Date.now()};persist();scheduleSave()}
function progress(){position={key:bookKey(),index:i,at:Date.now()};persist();scheduleSave()}
function status(t){$('cloudStatus').textContent=t}
async function api(path,opts={}){let r=await fetch('https://www.googleapis.com/'+path,{...opts,headers:{Authorization:'Bearer '+token,...opts.headers}});if(!r.ok)throw Error('Google API HTTP '+r.status+' '+(await r.text()).slice(0,180));return r.status===204?{}:r.json()}
function merge(a,b){let m=new Map();for(let e of [...a,...b])if(e&&e.id)m.set(e.id,e);return [...m.values()].sort((x,y)=>x.at-y.at)}
function applyRemote(remote){for(let [k,v] of Object.entries(remote.mappings||{}))if(!mappings[k]||(v.at||0)>(mappings[k].at||0))mappings[k]=v;events=merge(events,remote.events||[]);if((remote.position?.at||0)>position.at)position=remote.position;persist()}
async function findCloud(){let q=encodeURIComponent("name = 'study-data.json' and trashed = false");let x=await api('drive/v3/files?q='+q+'&fields=nextPageToken,files(id,name,modifiedTime,version)&page_size=100');let files=x.files||[];if(files.length>1)throw Error('study-data.json が複数あります。安全のため同期を停止しました');return files[0]||null}
async function readCloud(id){let r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('履歴取得 HTTP '+r.status);let x=await r.json();if(!Array.isArray(x.events))throw Error('保存形式が不正です');return x}
async function connect(){try{if(!window.google?.accounts?.oauth2)throw Error('Google認証ライブラリの読み込み待ち');status('Google認証中…');token=await new Promise((resolve,reject)=>{google.accounts.oauth2.initTokenClient({client_id:CLIENT,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>r.access_token?resolve(r.access_token):reject(Error(r.error||'認証失敗')),error_callback:e=>reject(Error(e.type||'認証中断'))}).requestAccessToken({prompt:'select_account consent'})});let file=await findCloud();if(file){cloudId=file.id;cloudVersion=file.version;applyRemote(await readCloud(cloudId))}else cloudId=null;$('saveCloud').disabled=false;status('接続成功。'+events.length+'件の回答履歴を保持');await saveCloud()}catch(e){status('接続失敗：'+e.message);token=null}}
async function saveCloud(){if(!token||saving)return;saving=true;status('クラウド同期中…');try{let file=await findCloud();if(file){let remote=await readCloud(file.id);applyRemote(remote);cloudId=file.id;cloudVersion=file.version}else cloudId=null;let payload=JSON.stringify({schema:2,events,position,mappings,updatedAt:Date.now()});if(cloudId){let meta=await api('drive/v3/files/'+encodeURIComponent(cloudId)+'?fields=version');if(String(meta.version)!==String(cloudVersion))throw Error('同期中に更新を検出しました。再同期してください');await api('upload/drive/v3/files/'+encodeURIComponent(cloudId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:payload})}else{let boundary='study_boundary_'+Date.now();let body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'study-data.json',mimeType:'application/json'})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+payload+'\r\n--'+boundary+'--';let created=await api('upload/drive/v3/files?uploadType=multipart&fields=id,version',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});cloudId=created.id}status('☁ 同期完了：'+new Date().toLocaleTimeString()+' / '+events.length+'件')}catch(e){status('⚠ 同期失敗。端末内の履歴は保持：'+e.message)}finally{saving=false}}
let timer;function scheduleSave(){if(!token)return;clearTimeout(timer);timer=setTimeout(saveCloud,800)}
$('connect').onclick=connect;$('saveCloud').onclick=saveCloud;
restoreMapping();show();</script></html>
