<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英検面接 IM1</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#1d3049;font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid #dce5f0;border-radius:15px;padding:16px;margin:12px 0}h1{font-size:22px}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:11px}input,textarea,select{width:100%}button{background:#edf2f8;font-weight:700;color:#173858}button.primary{background:#1765d1;color:#fff}button.success{background:#13815b;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}label{display:block;font-weight:650;margin:10px 0 5px}.muted{color:#64748b;font-size:13px}.hidden{display:none}.card{background:#eff5ff;border:1px solid #d4e3f8;border-radius:14px;padding:20px;margin:12px 0;min-height:130px}.big{font-size:clamp(19px,5vw,29px);font-weight:750;line-height:1.5}.progress{height:7px;border-radius:7px;background:#e2e8f0;overflow:hidden}.progress div{height:100%;background:#1765d1}img{max-width:100%;max-height:270px;object-fit:contain;border-radius:9px}textarea{min-height:80px}button:disabled{opacity:.5}</style></head><body><main class="wrap"><h1>英検面接モード <small class="muted">IM1・3級</small></h1><section class="panel"><b>Googleスプレッドシート連携</b><p class="muted">2つのタブをそれぞれ「ウェブに公開 → CSV」で公開し、URLを登録してください。</p><label>① 英検面接問題（30セット）CSV URL</label><input id="setsUrl" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"><label>② 英検面接質問（150問）CSV URL</label><input id="questionsUrl" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"><div class="row"><button id="saveUrls">URLを保存</button><button class="primary" id="load">最新データ取得</button></div><p id="loadStatus" class="muted">未読み込み</p></section><section class="panel"><label>面接セットを選択</label><select id="setSelect"></select><div class="row"><button id="start" class="primary">▶ 面接を開始</button><button id="reset">最初から</button></div><p class="muted" id="progressText"></p><div class="progress"><div id="bar"></div></div></section><section class="panel"><b id="phaseTitle">面接カード</b><div id="content" class="card"><div class="big">CSVを登録して面接を開始してください。</div></div><div id="illustration"></div><div class="row"><button id="speak" class="primary">🔊 英語を再生</button><button id="again">↻ もう一度</button></div><div class="row"><button id="prev">← 前へ</button><button id="next" class="primary">次へ →</button></div><div id="answerPanel" class="hidden"><label>自分の回答（練習用）</label><textarea id="answer" placeholder="英語で答えを入力できます"></textarea><div class="row"><button id="reveal">模範回答・採点ポイントを表示</button><button class="success" id="complete">✓ 回答済みにする</button></div><div id="feedback" class="hidden card"></div></div></section><p class="muted">本番形式の質問順を練習できます。音声認識・AI自動採点・Googleドライブ同期は今後の実装対象です。学習履歴はこの端末に保存されます。</p></main><script>
const $=id=>document.getElementById(id),prefix='my-learning-interview-im1-',read=(k,d)=>{try{return JSON.parse(localStorage.getItem(prefix+k))??d}catch{return d}},put=(k,v)=>localStorage.setItem(prefix+k,JSON.stringify(v));
let sets=read('sets',[]),questions=read('questions',[]),selected=read('selected',''),phase=0,answers=read('answers',{}),spoken='',stage='idle';
$('setsUrl').value=read('setsUrl','');$('questionsUrl').value=read('questionsUrl','');
function csv(t){let out=[],row=[],value='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){value+='"';i++}else q=!q}else if(c===','&&!q){row.push(value);value=''}else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(value);value='';if(row.some(x=>x.trim()))out.push(row);row=[]}else value+=c}row.push(value);if(row.some(x=>x.trim()))out.push(row);return out}
function rows(t){const a=csv(t);return a.slice(1).map(r=>r.map(x=>x.trim())).filter(r=>r[0])}
function save(){put('setsUrl',$('setsUrl').value.trim());put('questionsUrl',$('questionsUrl').value.trim())}
$('saveUrls').onclick=()=>{save();$('loadStatus').textContent='URLを保存しました'};
$('load').onclick=async()=>{save();$('loadStatus').textContent='読み込み中…';try{const urls=[$('setsUrl').value.trim(),$('questionsUrl').value.trim()];if(urls.some(x=>!/^https:\/\//.test(x)))throw Error('両方の公開CSV URLを入力してください');const res=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'})));for(const r of res)if(!r.ok)throw Error('HTTP '+r.status);const [a,b]=await Promise.all(res.map(r=>r.text()));const h1=csv(a)[0],h2=csv(b)[0];if(h1?.[0]?.trim()!=='セットID'||h2?.[0]?.trim()!=='セットID')throw Error('CSVのA列見出しは「セットID」にしてください');sets=rows(a);questions=rows(b);if(!sets.length||!questions.length)throw Error('問題または質問が空です');put('sets',sets);put('questions',questions);$('loadStatus').textContent=sets.length+'セット・'+questions.length+'問を読み込みました';populate()}catch(e){$('loadStatus').textContent='読み込み失敗：'+e.message}};
function populate(){const el=$('setSelect');el.replaceChildren();sets.forEach(s=>el.add(new Option(s[0]+'｜'+(s[2]||s[3]||'面接'),s[0])));if(!sets.some(s=>s[0]===selected))selected=sets[0]?.[0]||'';el.value=selected;render()}
$('setSelect').onchange=()=>{selected=$('setSelect').value;put('selected',selected);phase=0;stage='idle';render()};
const qs=()=>questions.filter(q=>q[0]===selected).sort((a,b)=>Number(a[1])-Number(b[1])),set=()=>sets.find(s=>s[0]===selected),setText=(t)=>{$('content').replaceChildren();const d=document.createElement('div');d.className='big';d.textContent=t;$('content').append(d)};
function render(){const s=set(),list=qs(),q=list[phase-1];$('answerPanel').classList.toggle('hidden',phase===0||phase>list.length);$('feedback').classList.add('hidden');$('illustration').replaceChildren();$('bar').style.width=(list.length?Math.min(100,100*phase/(list.length+1)):0)+'%';$('progressText').textContent=s?'セット '+selected+'　'+(phase===0?'英文カード':phase>list.length?'終了':phase+' / '+list.length+'問'):'セットを選択してください';if(!s){setText('CSVを登録してください');spoken='';return}if(phase===0){$('phaseTitle').textContent=(s[3]||'Reading Passage')+'（黙読 '+(s[6]||20)+'秒）';spoken=s[4]||'';setText(spoken);if(s[5]&&/^https:\/\//.test(s[5])){const img=document.createElement('img');img.src=s[5];img.alt='問題カードのイラスト';img.onerror=()=>img.remove();$('illustration').append(img)}}else if(q){$('phaseTitle').textContent='Question '+(q[1]||phase);spoken=q[3]||'';setText(spoken);$('answer').value=answers[selected+'|'+q[1]]||''}else{$('phaseTitle').textContent='面接終了';spoken='';setText('Good job! 面接練習が終了しました。')}}
$('start').onclick=()=>{if(!set())return;phase=0;stage='active';render();speak()};$('reset').onclick=()=>{phase=0;render()};
$('next').onclick=()=>{if(!set())return;phase=Math.min(qs().length+1,phase+1);render();if(phase<=qs().length)speak()};
$('prev').onclick=()=>{phase=Math.max(0,phase-1);render()};
function speak(){if(!spoken||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
$('speak').onclick=speak;$('again').onclick=speak;
$('answer').oninput=()=>{const q=qs()[phase-1];if(!q)return;answers[selected+'|'+q[1]]=$('answer').value;put('answers',answers)};
$('reveal').onclick=()=>{const q=qs()[phase-1];if(!q)return;const box=$('feedback');box.replaceChildren();for(const [title,val] of [['日本語訳',q[4]],['模範回答',q[5]],['模範回答の日本語訳',q[6]],['採点ポイント',q[7]]]){const p=document.createElement('p');const b=document.createElement('b');b.textContent=title+'：';p.append(b,document.createTextNode(val||'未登録'));box.append(p)}box.classList.remove('hidden')};
$('complete').onclick=()=>{$('next').click()};
populate();
</script></body></html>
